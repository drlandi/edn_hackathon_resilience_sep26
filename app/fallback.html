<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wizard - Modo de Contingência Ativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-amber-950 text-slate-100 min-h-screen flex items-center justify-center p-4">
  <main class="max-w-md w-full bg-slate-900 rounded-xl shadow-2xl p-6 border border-amber-500/50">
    <div class="text-center mb-6">
      <span class="inline-block px-3 py-1 text-xs font-bold uppercase tracking-wider bg-amber-500/20 text-amber-400 border border-amber-500/40 rounded-full mb-3">
        Origem Secundária Ativa
      </span>
      <h1 class="text-2xl font-extrabold text-white">Wizard Contingency Edge</h1>
      <p class="text-xs text-amber-200/80 mt-1">
        Failover ativado via CloudFront Origin Group. O cadastro de leads permanece 100% operacional.
      </p>
    </div>

    <form id="leadForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">Nome Completo</label>
        <input type="text" id="name" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">E-mail</label>
        <input type="email" id="email" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-300 mb-1">WhatsApp</label>
        <input type="tel" id="phone" required class="w-full px-3 py-2 bg-slate-950 border border-slate-700 rounded-lg text-white text-sm focus:outline-none focus:border-amber-500">
      </div>
      <button type="submit" id="submitBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-bold py-2.5 rounded-lg transition-all text-sm">
        Garantir Vaga no Modo Contingência
      </button>
    </form>

    <div id="statusMsg" class="mt-4 p-3 rounded-lg text-sm text-center hidden"></div>
  </main>

  <script>
    const form = document.getElementById('leadForm');
    const msg = document.getElementById('statusMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = "mt-4 p-3 rounded-lg text-sm text-center bg-amber-900/50 text-amber-200 border border-amber-700";
      msg.textContent = "Processando requisição pela rota secundária...";
      msg.classList.remove('hidden');

      const payload = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        origin_mode: "fallback_origin",
        timestamp: new Date().toISOString()
      };

      try {
        console.log("Payload enviado a partir da Origem Secundária:", payload);
        await new Promise(resolve => setTimeout(resolve, 800)); 

        msg.className = "mt-4 p-3 rounded-lg text-sm text-center bg-emerald-900/50 text-emerald-200 border border-emerald-700";
        msg.textContent = "Lead capturado com sucesso durante o failover!";
        form.reset();
      } catch (err) {
        msg.className = "mt-4 p-3 rounded-lg text-sm text-center bg-rose-900/50 text-rose-200 border border-rose-700";
        msg.textContent = "Erro ao enviar contingência.";
      }
    });
  </script>
</body>
</html>
